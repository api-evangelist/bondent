aid: bondent
name: Bondent (博恩登特)
description: >-
  Bondent (博恩登特, Bondent Group / 博恩集团) is a Chinese oral-healthcare technology
  company that provides an integrated, digitalized platform and hardware for dental
  clinics. It develops and manufactures its own clinical equipment — oral CBCT / CT
  imaging (Bojue series), dental microscopes (Semorr), dental chairs (Bomesin), dental
  lasers (Doctor Smile), UDG endodontic/root-canal systems, intraoral digital impression
  scanners, and periodontal/implant and digital-orthodontics solutions — alongside the
  Edent clinic-management software and the "Bondent Cloud" (博恩云) app for dentists.
  The company pairs manufacturing with training academies (Bondent Academy / 博恩学苑,
  Star EMBA), operating eight factories, four solution families across ten product
  series, over a thousand employees, and serving more than 200,000 dentists. This
  API Evangelist profile was seeded as a qiming portfolio lead; no public developer
  or API surface was found during enrichment.
